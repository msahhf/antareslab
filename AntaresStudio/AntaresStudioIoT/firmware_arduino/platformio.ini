; PlatformIO Project Configuration File
; AntaresStudio IoT - Arduino Nano Firmware
;
; Görevler:
;   - Step motor kontrolü (döner tabla)
;   - Sensör okumaları (ToF, IMU)
;   - ESP32-CAM ile UART haberleşme

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200

lib_deps =
    Wire

build_flags =
    -DSERIAL_BAUD=115200
