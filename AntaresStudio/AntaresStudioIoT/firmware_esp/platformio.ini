; PlatformIO Project Configuration File
; AntaresStudio IoT - ESP32-CAM Firmware
;
; Görevler:
;   - mDNS ile ağ keşfi
;   - OTA firmware güncelleme (kendi + Arduino UART Bridge)
;   - Kamera ile fotoğraf çekimi ve backend'e gönderim
;   - UART üzerinden Arduino ile haberleşme

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Kütüphaneler
lib_deps =
    ESP32 BLE Arduino
    ArduinoJson@^6.21.0
    ESPAsyncWebServer
    AsyncTCP

; Build flags
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1

; OTA ayarları
upload_protocol = espota
upload_port = antares-scanner.local
